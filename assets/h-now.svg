<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" font-family="RBody, Barlow, sans-serif">
<style>@font-face{font-family:RCond;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:RMono;src:url(data:font/woff2;base64,) format('woff2');}
.cond{font-family:RCond,'Barlow Condensed',sans-serif;font-weight:700}.condm{font-family:RCondM,'Barlow Condensed',sans-serif;font-weight:500}.mono{font-family:RMono,'JetBrains Mono',monospace}
.bar{transform-origin:0 0;animation:bar 1.2s cubic-bezier(.7,0,.2,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.slide{animation:slide .8s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}}
.slide2{animation:fade 1s ease-out .8s both}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<clipPath id="card"><rect width="1200" height="96" rx="6"/></clipPath>
<g clip-path="url(#card)"><rect width="1200" height="96" fill="#07080a"/>
<rect class="bar" x="0" y="0" width="1200" height="3" fill="#e60000"/></g>
<text x="32" y="62" class="mono" font-size="18" fill="#e60000" letter-spacing="2">01</text>
<rect class="blink" x="68" y="44" width="10" height="20" fill="#e60000"/>
<text x="94" y="66" class="cond slide" font-size="40" fill="#eeeeee" letter-spacing="1.5">THE DAY JOB</text>
<text x="1168" y="62" class="mono slide2" font-size="13" fill="#8a9099" text-anchor="end" letter-spacing="2">WHERE THE RENT COMES FROM</text>
</svg>
